<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>텀블러 공장 제조품질관리</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #19342d;
        background: #f2f6f3;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
      }

      .app-header {
        min-height: 76px;
        box-sizing: border-box;
        width: 100%;
        padding: 12px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        background: #fff;
        border-bottom: 1px solid #d8e3dc;
      }

      .yellow-notice {
        box-sizing: border-box;
        width: 100%;
        padding: 14px 32px;
        color: #624b0b;
        background: #fff3bf;
        border-bottom: 1px solid #ead98a;
        line-height: 1.5;
      }

      .brand-link,
      .header-actions {
        display: flex;
        align-items: center;
      }

      .brand-link {
        gap: 12px;
        color: inherit;
        font-size: 20px;
        font-weight: 750;
        text-decoration: none;
      }

      .brand-link img {
        width: 44px;
        height: 44px;
      }

      .header-actions {
        gap: 22px;
      }

      .header-actions a {
        color: #276447;
        font-weight: 650;
      }

      .header-user {
        color: #40584d;
        white-space: nowrap;
      }

      .logout-button {
        width: auto;
        margin: 0;
        padding: 9px 14px;
      }

      [hidden] {
        display: none !important;
      }

      .page-content {
        flex: 1;
        width: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .login-box {
        width: min(100%, 420px);
        box-sizing: border-box;
        padding: 36px;
        border: 1px solid #d8e3dc;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 12px 34px rgb(25 52 45 / 8%);
      }

      h1 {
        margin: 0 0 28px;
        font-size: 28px;
        line-height: 1.35;
      }

      label {
        display: block;
        margin: 18px 0 8px;
        font-weight: 650;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #b9c9c0;
        border-radius: 9px;
        font: inherit;
      }

      input:focus {
        outline: 3px solid #b8d9c7;
        border-color: #39785a;
      }

      button {
        width: 100%;
        margin-top: 24px;
        padding: 14px;
        border: 0;
        border-radius: 9px;
        color: #fff;
        background: #276447;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .app-screen {
        flex: 1;
        width: min(100%, 920px);
        padding: 24px;
        border-radius: 14px;
        background: #fff;
      }

      .app-screen h1 {
        margin-bottom: 0;
      }

      .not-found-message {
        margin: 0;
      }

      .not-found-message p {
        margin: 0 0 18px;
      }

      .not-found-message a {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 8px;
        color: #fff;
        background: #276447;
        font-weight: 700;
        text-decoration: none;
      }

      .app-footer {
        width: 100%;
        padding: 18px 24px;
        color: #52665b;
        text-align: center;
        background: #fff;
        border-top: 1px solid #d8e3dc;
      }

      .error-message {
        margin: 16px 0 0;
        color: #b42318;
        font-weight: 600;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <a class="brand-link" href="/" aria-label="텀블러 공장 제조품질관리 홈">
        <img src="/logo.svg" alt="" />
        <span>텀블러 공장 제조품질관리</span>
      </a>
      <nav class="header-actions" id="header-actions" aria-label="계정 메뉴" hidden>
        <a href="/settings">설정</a>
        <span class="header-user" id="header-user"></span>
        <button class="logout-button" id="logout-button" type="button">로그아웃</button>
      </nav>
    </header>
    <aside class="yellow-notice" id="yellow-notice" hidden>AI 분석 결과는 보조 자료이며 품질 담당자의 확인이 필요합니다. 최종 출하 승인은 현장 기준에 따라 별도로 진행하세요.</aside>

    <main class="page-content">
      <section class="login-box" id="login-box">
        <h1>텀블러 공장 제조품질관리</h1>
        <form id="login-form">
          <label for="username">계정</label>
          <input id="username" name="username" type="text" value="writer" autocomplete="username" required />

          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" value="writer1234!" autocomplete="current-password" required />

          <button id="login-button" type="submit">로그인</button>
          <p id="login-error" class="error-message" role="alert" hidden></p>
        </form>
      </section>
      <section class="app-screen" id="app-screen" hidden>
        <h1 id="screen-title"></h1>
        <div id="not-found-view" class="not-found-message" hidden>
          <p>페이지를 찾을 수 없습니다.</p>
          <a href="/" id="home-link">홈으로 가기</a>
        </div>
      </section>
    </main>
    <footer class="app-footer" id="app-footer" hidden>텀블러 공장 품질관리 시스템입니다.</footer>
    <script>
      const loginBox = document.querySelector('#login-box');
      const loginForm = document.querySelector('#login-form');
      const loginButton = document.querySelector('#login-button');
      const loginError = document.querySelector('#login-error');
      const headerActions = document.querySelector('#header-actions');
      const headerUser = document.querySelector('#header-user');
      const logoutButton = document.querySelector('#logout-button');
      const yellowNotice = document.querySelector('#yellow-notice');
      const appFooter = document.querySelector('#app-footer');
      const appScreen = document.querySelector('#app-screen');
      const screenTitle = document.querySelector('#screen-title');
      const notFoundView = document.querySelector('#not-found-view');
      const roleLabels = { writer: '작성자', reviewer: '검토자', 'factory-user': '품질관리' };

      function renderScreen() {
        const route = window.location.pathname;
        let title;

        if (route === '/') title = '품질 현황';
        else if (route === '/inspections/new') title = '검사 등록';
        else if (/^\/inspections\/[^/]+$/.test(route)) title = '검사 상세';
        else if (route === '/settings') title = '설정';

        if (!title) {
          screenTitle.hidden = true;
          notFoundView.hidden = false;
          return;
        }

        screenTitle.textContent = title;
        screenTitle.hidden = false;
        notFoundView.hidden = true;
      }

      function showApp(user) {
        loginBox.hidden = true;
        appScreen.hidden = false;
        headerActions.hidden = false;
        yellowNotice.hidden = false;
        appFooter.hidden = false;
        headerUser.textContent = `${user.username} (${roleLabels[user.role] || user.role})`;
        renderScreen();
      }

      async function checkLogin() {
        try {
          const response = await fetch('/api/session');
          const result = await response.json();
          if (!response.ok) {
            loginError.textContent = result.error || '로그인 상태를 확인하지 못했습니다.';
            loginError.hidden = false;
            return;
          }
          if (result.user) showApp(result.user);
        } catch (error) {
          loginError.textContent = error.message || '로그인 상태를 확인하지 못했습니다.';
          loginError.hidden = false;
        }
      }

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        loginError.hidden = true;
        loginButton.disabled = true;

        const formData = new FormData(loginForm);
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: formData.get('username'),
              password: formData.get('password'),
            }),
          });
          const result = await response.json();
          if (!response.ok || result.error) {
            loginError.textContent = result.error || '로그인 정보를 확인하세요.';
            loginError.hidden = false;
            return;
          }
          showApp(result.user);
        } catch (error) {
          loginError.textContent = error.message || '서버와 통신할 수 없습니다.';
          loginError.hidden = false;
        } finally {
          loginButton.disabled = false;
        }
      });

      logoutButton.addEventListener('click', async () => {
        logoutButton.disabled = true;
        try {
          const response = await fetch('/api/logout', { method: 'POST' });
          const result = await response.json();
          if (!response.ok || result.error) {
            throw new Error(result.error || '로그아웃하지 못했습니다.');
          }

          loginForm.reset();
          loginError.textContent = '';
          loginError.hidden = true;
          headerUser.textContent = '';
          headerActions.hidden = true;
          yellowNotice.hidden = true;
          appFooter.hidden = true;
          appScreen.hidden = true;
          loginBox.hidden = false;
        } catch (error) {
          loginError.textContent = error.message || '로그아웃하지 못했습니다.';
          loginError.hidden = false;
          loginBox.hidden = false;
        } finally {
          logoutButton.disabled = false;
        }
      });

      document.addEventListener('click', (event) => {
        const link = event.target.closest('a');
        if (
          !link ||
          event.defaultPrevented ||
          event.button !== 0 ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey ||
          link.target ||
          link.hasAttribute('download')
        ) {
          return;
        }

        const destination = new URL(link.href, window.location.href);
        if (destination.origin !== window.location.origin) return;

        event.preventDefault();
        if (window.location.pathname !== destination.pathname || window.location.search !== destination.search || window.location.hash !== destination.hash) {
          history.pushState({}, '', destination.href);
        }
        renderScreen();
      });

      window.addEventListener('popstate', renderScreen);

      checkLogin();
    </script>
  </body>
</html>
